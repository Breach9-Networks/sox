# sox configuration file
# Copy this to config.toml and modify as needed.

# SOCKS proxy listen address
listen = "0.0.0.0:1080"

# Connection limits
max_connections = 10000
max_connections_per_ip = 100

# Timeouts (in seconds)
handshake_timeout = 5
connect_timeout = 10
dns_timeout = 5
idle_timeout = 300
drain_timeout = 30

# Authentication (optional)
# Remove this section to disable authentication.
[auth]
users = [
  { username = "alice", password = "secret" },
  { username = "bob", password = "hunter2" },
]

# TCP keepalive settings
[keepalive]
idle = 30       # Seconds before first probe
interval = 10   # Seconds between probes
probes = 3      # Number of probes before declaring dead

# Tunnel settings (for server/client mode)
[tunnel]
listen = "0.0.0.0:9090"           # Server: tunnel listen address
secret = "change-me"              # Shared secret for Noise encryption (server + client)
# server_addr = "1.2.3.4:9090"      # Client: server address
# client_id = "office-node"         # Client: unique identifier
# tunnel_sessions = 8               # Client: concurrent yamux sessions
# max_streams_per_session = 256     # Per-session yamux stream cap
# recv_window_mb = 256              # Per-session yamux receive window (MiB).
                                    #   Must be >> max_streams_per_session × 256 KiB
                                    #   (= 64 MiB at 256 streams) or yamux per-stream
                                    #   BDP auto-tune has no headroom and a single
                                    #   stream tops out at ~256 KiB / RTT.
# reconnect_interval = 5            # Reconnect backoff base (seconds)
# reconnect_max = 60                # Reconnect backoff cap (seconds)

# Upstream HTTP proxy (standalone only; e.g. Burp)
# [upstream]
# proxy = "http://127.0.0.1:8080"   # Forward CONNECTs through this HTTP proxy
# udp = "reject"                    # UDP ASSOCIATE: reject (keep all flows on the proxy) | direct
# sni = false                       # Name IP-only CONNECTs by the client's TLS SNI (VPN capture apps)
