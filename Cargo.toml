[package]
name = "sox"
version = "0.2.0"
edition = "2024"
description = "A high-performance, cross-platform SOCKS proxy server with reverse tunnel support"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "macros", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
socket2 = "0.5"
tokio-util = { version = "0.7", features = ["compat"] }
snow = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
blake2 = "0.10"
yamux = "0.13"
rand = "0.9"
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# `test-util` lets timer-driven logic (idle watchers, backoff) be tested with
# paused time instead of real sleeps.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# "unwind" (not "abort"): the tunnel client supervises its session workers with
# `catch_unwind` and restarts them — with "abort" one task panic would kill every
# connection in the process. Stability outranks the few KiB saved.
panic = "unwind"
strip = true

# The binary as a whole is optimized for size, but tunnel throughput is bound
# by the AEAD: at "z" the ChaCha20-Poly1305 loops are neither vectorized nor
# inlined. Optimizing just the data-path crates for speed recovers the
# throughput for a fraction of the size cost (see tasks/lessons.md).
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.snow]
opt-level = 3
[profile.release.package.yamux]
opt-level = 3
